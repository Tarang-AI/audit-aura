
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ENABLED=${OPENAI_ENABLED:-false}
      - LM_STUDIO_ENABLED=${LM_STUDIO_ENABLED:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://opencode.ai/zen}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-minimax-m2.5-free}
      - MOCK_MODE=${MOCK_MODE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COMPLIANCE_CHECK_INTERVAL=${COMPLIANCE_CHECK_INTERVAL:-30}
    volumes:
      - ./backend/data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    depends_on: []

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend



volumes:
  huggingface_cache:
